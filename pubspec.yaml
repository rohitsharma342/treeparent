name: tree_parent
description: A personalized mobile app designed to guide users through the process of nurturing and caring for trees.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.1
  shared_preferences: ^2.2.2
  shared_preferences_web: ^2.2.1
  intl: ^0.18.1
  cached_network_image: ^3.3.1
  uuid: ^4.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true